<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 426" width="1050" height="426" role="img" aria-labelledby="t d"><title id="t">知识、工具和分工</title><desc id="d">用一次局部剪辑请求区分知识拆分、工具拆分和执行拆分。</desc><rect width="1050" height="426" fill="#f8f6ed"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="39" y="65" font-size="39" fill="#202c29" font-weight="600" >同一个改稿请求，三个架构决定</text><text x="40" y="109" font-size="23" fill="#455b54" font-weight="400" >“只换最后一个镜头，音乐和前面都别动。”</text><rect x="40" y="149" width="303" height="190" rx="12" fill="#e2eee7"/><text x="60" y="193" font-size="29" fill="#174e43" font-weight="600" >知识</text><text x="60" y="229" font-size="21" fill="#202c29" font-weight="550" >交给模型哪些方法</text><text x="60" y="277" font-size="20" fill="#202c29" font-weight="400" >辨认视线与反应</text><text x="60" y="312" font-size="18" fill="#425951" font-weight="400" >给出适用条件和反例</text><rect x="372" y="149" width="303" height="190" rx="12" fill="#f1e8d5"/><text x="392" y="193" font-size="29" fill="#174e43" font-weight="600" >工具</text><text x="392" y="229" font-size="21" fill="#202c29" font-weight="550" >向模型开放哪些动作</text><text x="392" y="277" font-size="20" fill="#202c29" font-weight="400" >等长替换一个镜头</text><text x="392" y="312" font-size="18" fill="#425951" font-weight="400" >校验锁轨，返回实际差异</text><rect x="704" y="149" width="303" height="190" rx="12" fill="#e6eceb"/><text x="724" y="193" font-size="29" fill="#174e43" font-weight="600" >分工</text><text x="724" y="229" font-size="21" fill="#202c29" font-weight="550" >谁取证，谁作决定</text><text x="724" y="277" font-size="20" fill="#202c29" font-weight="400" >多路寻找，一处试剪</text><text x="724" y="312" font-size="18" fill="#425951" font-weight="400" >让主创回看连续原片</text><text x="40" y="391" font-size="22" fill="#28483d" font-weight="400" >验收同一件作品：先核对改动的范围，再看观众能否读懂那一眼。</text></g></svg>
