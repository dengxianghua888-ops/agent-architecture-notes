<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 560" width="934" height="560" role="img" aria-labelledby="t d"><title id="t">调用链长度与一次走通概率</title><desc id="d">单步成功率为99%、95%、90%时，6步一次走通约为94.1%、73.5%、53.1%，12步约为88.6%、54.0%、28.2%。</desc><rect width="934" height="560" fill="#f8f6ed"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, WenQuanYi Zen Hei, sans-serif"><text x="34.0" y="53.0" font-size="32" fill="#202c29" font-weight="600" text-anchor="start">每多一步，一次走通就难一点</text><text x="35.0" y="90.0" font-size="19" fill="#455b54" font-weight="400" text-anchor="start">每次调用都独立、成功率相同时，n 步链路一次走通的概率 = 单步成功率的 n 次方</text><path d="M96 460.0H736" stroke="#d1d8cd" stroke-width="1"/><text x="84.0" y="466.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="end">0%</text><path d="M96 377.5H736" stroke="#d1d8cd" stroke-width="1"/><text x="84.0" y="383.5" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="end">25%</text><path d="M96 295.0H736" stroke="#d1d8cd" stroke-width="1"/><text x="84.0" y="301.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="end">50%</text><path d="M96 212.5H736" stroke="#d1d8cd" stroke-width="1"/><text x="84.0" y="218.5" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="end">75%</text><path d="M96 130.0H736" stroke="#d1d8cd" stroke-width="1"/><text x="84.0" y="136.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="end">100%</text><text x="96.0" y="486.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">1</text><text x="212.4" y="486.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">3</text><text x="386.9" y="486.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">6</text><text x="561.5" y="486.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">9</text><text x="736.0" y="486.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">12</text><text x="416.0" y="512.0" font-size="15" fill="#455b54" font-weight="400" text-anchor="middle">链路里需要做对的调用次数</text><path d="M386.9 130V460" stroke="#6a7c75" stroke-width="1" stroke-dasharray="4 4"/><text x="394.9" y="448.0" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">6 步：一次局部改稿的常见长度</text><polyline points="96.0,133.3 154.2,136.6 212.4,139.8 270.5,143.0 328.7,146.2 386.9,149.3 445.1,152.4 503.3,155.5 561.5,158.5 619.6,161.6 677.8,164.5 736.0,167.5" fill="none" stroke="#00806a" stroke-width="2.2" stroke-linejoin="round"/><circle cx="386.9" cy="149.3" r="5" fill="#00806a" stroke="#f8f6ed" stroke-width="2"/><text x="376.9" y="140.3" font-size="15" fill="#202c29" font-weight="600" text-anchor="end">94.1%</text><text x="746.0" y="172.5" font-size="15" fill="#202c29" font-weight="600" text-anchor="start">单步 99%</text><text x="746.0" y="192.5" font-size="13" fill="#455b54" font-weight="400" text-anchor="start">12 步 88.6%</text><polyline points="96.0,146.5 154.2,162.2 212.4,177.1 270.5,191.2 328.7,204.7 386.9,217.4 445.1,229.5 503.3,241.1 561.5,252.0 619.6,262.4 677.8,272.3 736.0,281.7" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linejoin="round"/><circle cx="386.9" cy="217.4" r="5" fill="#c2410c" stroke="#f8f6ed" stroke-width="2"/><text x="376.9" y="208.4" font-size="15" fill="#202c29" font-weight="600" text-anchor="end">73.5%</text><text x="746.0" y="286.7" font-size="15" fill="#202c29" font-weight="600" text-anchor="start">单步 95%</text><text x="746.0" y="306.7" font-size="13" fill="#455b54" font-weight="400" text-anchor="start">12 步 54.0%</text><polyline points="96.0,163.0 154.2,192.7 212.4,219.4 270.5,243.5 328.7,265.1 386.9,284.6 445.1,302.2 503.3,317.9 561.5,332.2 619.6,344.9 677.8,356.4 736.0,366.8" fill="none" stroke="#6d5bd0" stroke-width="2.2" stroke-linejoin="round"/><circle cx="386.9" cy="284.6" r="5" fill="#6d5bd0" stroke="#f8f6ed" stroke-width="2"/><text x="376.9" y="275.6" font-size="15" fill="#202c29" font-weight="600" text-anchor="end">53.1%</text><text x="746.0" y="371.8" font-size="15" fill="#202c29" font-weight="600" text-anchor="start">单步 90%</text><text x="746.0" y="391.8" font-size="13" fill="#455b54" font-weight="400" text-anchor="start">12 步 28.2%</text><text x="34.0" y="538.0" font-size="14" fill="#6a7c75" font-weight="400" text-anchor="start">示意计算，不是实测。真实调用的出错并不独立，严格校验会让错误“失败关闭”，代价变成重试与等待。</text></g></svg>
