<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 470" width="934" height="470" role="img" aria-labelledby="t d"><title id="t">付费试拍的积分去向</title><desc id="d">24条候选中7条进入最终成片，占积分29.2%；5条只进入对照版，占20.8%；12条均未用上，占50%。最终成片360帧中有165帧，即45.8%，来自3条整镜未通过复核的源片。</desc><rect width="934" height="470" fill="#f8f6ed"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, WenQuanYi Zen Hei, sans-serif"><text x="34.0" y="53.0" font-size="32" fill="#202c29" font-weight="600" text-anchor="start">5,376 积分去了哪里</text><text x="35.0" y="90.0" font-size="19" fill="#455b54" font-weight="400" text-anchor="start">一场 15 秒的付费试拍：24 条候选，每条 224 积分</text><text x="34.0" y="136.0" font-size="16" fill="#455b54" font-weight="600" text-anchor="start">按积分（24 条）</text><rect x="34.0" y="150" width="250.6" height="46" rx="3" fill="#00806a"/><text x="36.0" y="226.0" font-size="15" fill="#202c29" font-weight="600" text-anchor="start">进入最终成片 7 条</text><text x="36.0" y="248.0" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">1,568 · 29.2%</text><rect x="286.6" y="150" width="178.4" height="46" rx="3" fill="#6d5bd0"/><text x="288.6" y="226.0" font-size="15" fill="#202c29" font-weight="600" text-anchor="start">只进入对照版 5 条</text><text x="288.6" y="248.0" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">1,120 · 20.8%</text><rect x="467.0" y="150" width="431.0" height="46" rx="3" fill="#c2410c"/><text x="469.0" y="226.0" font-size="15" fill="#202c29" font-weight="600" text-anchor="start">均未用上 12 条</text><text x="469.0" y="248.0" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">2,688 · 50.0%</text><text x="34.0" y="304.0" font-size="16" fill="#455b54" font-weight="600" text-anchor="start">按最终成片的帧（360 帧）</text><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#cfe7df"/><path d="M0 0V8" stroke="#00806a" stroke-width="4"/></pattern></defs><rect x="34.0" y="318" width="467.1" height="46" rx="3" fill="#00806a"/><text x="36.0" y="394.0" font-size="15" fill="#202c29" font-weight="600" text-anchor="start">4 条整镜通过的源片</text><text x="36.0" y="416.0" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">195 帧 · 54.2%</text><rect x="503.1" y="318" width="394.9" height="46" rx="3" fill="url(#hatch)"/><text x="505.1" y="394.0" font-size="15" fill="#202c29" font-weight="600" text-anchor="start">3 条整镜未通过、仍被剪入的源片</text><text x="505.1" y="416.0" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">165 帧 · 45.8%</text><text x="34.0" y="452.0" font-size="13.5" fill="#6a7c75" font-weight="400" text-anchor="start">资料：精品 AI 短剧 Skill《登记桌前 15 秒，5,376 积分花在哪里》。整镜复核与按用途取段是两套标准。</text></g></svg>
