<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 574" width="934" height="574" role="img" aria-labelledby="t d"><title id="t">技能加载条件与任务通过率</title><desc id="d">同一款模型，六种技能供应方式从强制加载精选的55.4%到无额外技能的35.4%。</desc><rect width="934" height="574" fill="#f8f6ed"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="34" y="53" font-size="33" fill="#202c29" font-weight="600" >好方法在库里，模型能用上多少？</text><text x="35" y="92" font-size="21" fill="#455b54" font-weight="400" >Opus 4.6 · 84 项任务 · 端到端通过率</text><path d="M284 127v338" stroke="#d1d8cd" stroke-width="1"/><text x="284" y="491" font-size="18" fill="#4b6059" font-weight="400" text-anchor="middle">0%</text><path d="M464 127v338" stroke="#d1d8cd" stroke-width="1"/><text x="464" y="491" font-size="18" fill="#4b6059" font-weight="400" text-anchor="middle">20%</text><path d="M644 127v338" stroke="#d1d8cd" stroke-width="1"/><text x="644" y="491" font-size="18" fill="#4b6059" font-weight="400" text-anchor="middle">40%</text><path d="M824 127v338" stroke="#d1d8cd" stroke-width="1"/><text x="824" y="491" font-size="18" fill="#4b6059" font-weight="400" text-anchor="middle">60%</text><text x="35" y="165" font-size="22" fill="#202c29" font-weight="400" >直接加载精选技能</text><rect x="284" y="142" width="498.6" height="27" rx="3" fill="#186452"/><text x="794.5999999999999" y="165" font-size="22" fill="#202c29" font-weight="600" >55.4%</text><text x="35" y="220" font-size="22" fill="#202c29" font-weight="400" >从精选中自行选择</text><rect x="284" y="197" width="460.8" height="27" rx="3" fill="#368572"/><text x="756.8" y="220" font-size="22" fill="#202c29" font-weight="600" >51.2%</text><text x="35" y="275" font-size="22" fill="#202c29" font-weight="400" >自选时加入干扰项</text><rect x="284" y="252" width="391.5" height="27" rx="3" fill="#69a094"/><text x="687.5" y="275" font-size="22" fill="#202c29" font-weight="600" >43.5%</text><text x="35" y="330" font-size="22" fill="#202c29" font-weight="400" >大库中保留精选技能</text><rect x="284" 