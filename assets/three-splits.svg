<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 596" width="934" height="596" role="img" aria-labelledby="t d"><title id="t">三种拆分</title><desc id="d">知识拆分改变模型读到什么，接口拆分改变模型要做几次正确操作，执行拆分改变谁看原片和谁拍板；每种拆分各有收益、风险和最便宜的对照。</desc><rect width="934" height="596" fill="#f8f6ed"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, WenQuanYi Zen Hei, sans-serif"><text x="34.0" y="53.0" font-size="32" fill="#202c29" font-weight="600" text-anchor="start">“拆细”其实是三件事</text><text x="35.0" y="90.0" font-size="19" fill="#455b54" font-weight="400" text-anchor="start">同一份改稿可以拆知识、拆接口、拆执行；三者改变的东西不同，要分开试</text><rect x="34" y="122" width="276" height="446" rx="6" fill="#ffffff" stroke="#d1d8cd"/><rect x="34" y="122" width="276" height="8" rx="3" fill="#00806a"/><text x="52.0" y="168.0" font-size="24" fill="#202c29" font-weight="600" text-anchor="start">知识拆分</text><text x="52.0" y="204.0" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">改变</text><text x="52.0" y="228.0" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">模型读到什么</text><text x="52.0" y="266.6" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">例子</text><text x="52.0" y="290.6" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">一本“重逢戏手册”拆成“辨认视</text><text x="52.0" y="315.3" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">线”“挑反应镜头”等几张方法卡</text><text x="52.0" y="353.9" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">收益</text><text x="52.0" y="377.9" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">方法能复用到预告片、访谈</text><text x="52.0" y="416.6" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">风险</text><text x="52.0" y="440.6" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">找不到、读错，或在不适用的场</text><text x="52.0" y="465.2" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">景照搬</text><text x="52.0" y="503.9" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">先这样测</text><text x="52.0" y="527.9" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">人工指定、模型自选、不给，三</text><text x="52.0" y="552.5" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">组对照</text><rect x="325" y="122" width="276" height="446" rx="6" fill="#ffffff" stroke="#d1d8cd"/><rect x="325" y="122" width="276" height="8" rx="3" fill="#6d5bd0"/><text x="343.0" y="168.0" font-size="24" fill="#202c29" font-weight="600" text-anchor="start">接口拆分</text><text x="343.0" y="204.0" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">改变</text><text x="343.0" y="228.0" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">模型要做几次正确操作</text><text x="343.0" y="266.6" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">例子</text><text x="343.0" y="290.6" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">“等长替换”是一个入口，还是“</text><text x="343.0" y="315.3" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">删除—插入—回填时长”三次调用</text><text x="343.0" y="353.9" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">收益</text><text x="343.0" y="377.9" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">内部每一步可单测、可组合</text><text x="343.0" y="416.6" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">风险</text><text x="343.0" y="440.6" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">参数写错；步骤越多，一次走通</text><text x="343.0" y="465.2" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">越难</text><text x="343.0" y="503.9" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">先这样测</text><text x="343.0" y="527.9" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">底层操作、组合入口、组合加下</text><text x="343.0" y="552.5" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">钻</text><rect x="616" y="122" width="276" height="446" rx="6" fill="#ffffff" stroke="#d1d8cd"/><rect x="616" y="122" width="276" height="8" rx="3" fill="#c2410c"/><text x="634.0" y="168.0" font-size="24" fill="#202c29" font-weight="600" text-anchor="start">执行拆分</text><text x="634.0" y="204.0" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">改变</text><text x="634.0" y="228.0" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">谁看原片，谁拍板</text><text x="634.0" y="266.6" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">例子</text><text x="634.0" y="290.6" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">三位助手分头找“对视”，交回</text><text x="634.0" y="315.3" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">时间码；一位剪辑者定稿</text><text x="634.0" y="353.9" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">收益</text><text x="634.0" y="377.9" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">覆盖更广，难处多花算力</text><text x="634.0" y="416.6" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">风险</text><text x="634.0" y="440.6" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">交接丢细节，协调吃预算</text><text x="634.0" y="479.2" font-size="14" fill="#6a7c75" font-weight="600" text-anchor="start">先这样测</text><text x="634.0" y="503.2" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">同预算单代理多次、固定流程、</text><text x="634.0" y="527.9" font-size="17" fill="#202c29" font-weight="400" text-anchor="start">动态委派</text></g></svg>
