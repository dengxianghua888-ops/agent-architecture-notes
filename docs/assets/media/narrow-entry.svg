<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 766" width="934" height="766" role="img" aria-labelledby="t d"><title id="t">内部原子，外部收窄的分层</title><desc id="d">委托经入口与路由进入场景判断；判断者只面对少数组合入口；编译校验、原子执行、工程状态与读回评审由程序持有；只读取证助手可以并行，把时间码和原片指针交回判断者。</desc><rect width="934" height="766" fill="#f8f6ed"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, WenQuanYi Zen Hei, sans-serif"><text x="34.0" y="53.0" font-size="32" fill="#202c29" font-weight="600" text-anchor="start">内部原子，外部收窄</text><text x="35.0" y="90.0" font-size="19" fill="#455b54" font-weight="400" text-anchor="start">原子操作留在程序里单测；模型只面对少数带类型的入口，取证并行、写入一支笔</text><rect x="112" y="118" width="560" height="62" rx="5" fill="#ffffff" stroke="#d1d8cd"/><text x="128.0" y="144.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">委托</text><text x="246.0" y="143.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">“把最后那个拥抱换掉。音乐和前面都别动。”</text><path d="M172 182v10" stroke="#6a7c75" stroke-width="1.6"/><path d="M168 188l4 5 4-5" fill="none" stroke="#6a7c75" stroke-width="1.6"/><rect x="112" y="194" width="560" height="62" rx="5" fill="#eef5f1" stroke="#d1d8cd"/><text x="128.0" y="220.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">入口与路由</text><text x="246.0" y="216.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">常驻十几条硬规则（冻结、否定、交付形式）加检索召回少量候</text><text x="246.0" y="237.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">选；产品界面可用场景卡直接指定</text><path d="M172 258v10" stroke="#6a7c75" stroke-width="1.6"/><path d="M168 264l4 5 4-5" fill="none" stroke="#6a7c75" stroke-width="1.6"/><rect x="112" y="270" width="560" height="62" rx="5" fill="#eef5f1" stroke="#d1d8cd"/><text x="128.0" y="296.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">场景判断</text><text x="246.0" y="292.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">在同一个上下文里决定取哪一段、节奏和取舍；读证据，不直接</text><text x="246.0" y="313.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">写工程</text><path d="M172 334v10" stroke="#6a7c75" stroke-width="1.6"/><path d="M168 340l4 5 4-5" fill="none" stroke="#6a7c75" stroke-width="1.6"/><rect x="112" y="346" width="560" height="62" rx="5" fill="#eef5f1" stroke="#d1d8cd"/><text x="128.0" y="372.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">组合入口</text><text x="246.0" y="368.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">6–10 组：等长替换并返回差异 · 改稿并预览 · 局部撤销；需</text><text x="246.0" y="389.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">要时下钻到单个操作</text><path d="M172 410v10" stroke="#6a7c75" stroke-width="1.6"/><path d="M168 416l4 5 4-5" fill="none" stroke="#6a7c75" stroke-width="1.6"/><rect x="112" y="422" width="560" height="62" rx="5" fill="#f1eff9" stroke="#d1d8cd"/><text x="128.0" y="448.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">编译与校验</text><text x="246.0" y="444.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">检查类型、锁定轨道、时长和前后依赖；不可满足时指出冲突项</text><text x="246.0" y="465.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">和可放宽项</text><path d="M172 486v10" stroke="#6a7c75" stroke-width="1.6"/><path d="M168 492l4 5 4-5" fill="none" stroke="#6a7c75" stroke-width="1.6"/><rect x="112" y="498" width="560" height="62" rx="5" fill="#f1eff9" stroke="#d1d8cd"/><text x="128.0" y="524.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">原子执行单元</text><text x="246.0" y="520.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">裁切、拼接、调音、字幕、调色……每个都能单测，不逐个暴露给</text><text x="246.0" y="541.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">模型</text><path d="M172 562v10" stroke="#6a7c75" stroke-width="1.6"/><path d="M168 568l4 5 4-5" fill="none" stroke="#6a7c75" stroke-width="1.6"/><rect x="112" y="574" width="560" height="62" rx="5" fill="#f1eff9" stroke="#d1d8cd"/><text x="128.0" y="600.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">工程状态</text><text x="246.0" y="596.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">基准版本校验 · 同一修改编号只生效一次 · 逐笔撤销 · 每次</text><text x="246.0" y="617.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">写入留回执</text><path d="M172 638v10" stroke="#6a7c75" stroke-width="1.6"/><path d="M168 644l4 5 4-5" fill="none" stroke="#6a7c75" stroke-width="1.6"/><rect x="112" y="650" width="560" height="62" rx="5" fill="#f1eff9" stroke="#d1d8cd"/><text x="128.0" y="676.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">读回与评审</text><text x="246.0" y="675.0" font-size="14.5" fill="#455b54" font-weight="400" text-anchor="start">程序硬门 → 校准过的模型预筛 → 人看完整成片</text><path d="M102 194h-8v214h8" fill="none" stroke="#00806a" stroke-width="2"/><text x="72.0" y="274.0" font-size="16" fill="#00806a" font-weight="600" text-anchor="middle">模</text><text x="72.0" y="296.0" font-size="16" fill="#00806a" font-weight="600" text-anchor="middle">型</text><text x="72.0" y="318.0" font-size="16" fill="#00806a" font-weight="600" text-anchor="middle">可</text><text x="72.0" y="340.0" font-size="16" fill="#00806a" font-weight="600" text-anchor="middle">见</text><path d="M102 422h-8v290h8" fill="none" stroke="#6d5bd0" stroke-width="2"/><text x="72.0" y="540.0" font-size="16" fill="#6d5bd0" font-weight="600" text-anchor="middle">程</text><text x="72.0" y="562.0" font-size="16" fill="#6d5bd0" font-weight="600" text-anchor="middle">序</text><text x="72.0" y="584.0" font-size="16" fill="#6d5bd0" font-weight="600" text-anchor="middle">持</text><text x="72.0" y="606.0" font-size="16" fill="#6d5bd0" font-weight="600" text-anchor="middle">有</text><rect x="698" y="206" width="212" height="190" rx="5" fill="#ffffff" stroke="#c2410c" stroke-dasharray="5 4"/><text x="712.0" y="234.0" font-size="16" fill="#202c29" font-weight="600" text-anchor="start">只读取证助手 × N</text><text x="712.0" y="262.0" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">可并行，不能写工程</text><text x="712.0" y="287.6" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">交回：素材 ID、起止帧、可</text><text x="712.0" y="307.2" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">回放片段</text><text x="712.0" y="332.8" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">以及不确定之处、看过但没选</text><text x="712.0" y="352.4" font-size="14" fill="#455b54" font-weight="400" text-anchor="start">的片段</text><path d="M698 301.0H676" stroke="#c2410c" stroke-width="1.6"/><path d="M682 297.0l-6 4 6 4" fill="none" stroke="#c2410c" stroke-width="1.6"/></g></svg>
