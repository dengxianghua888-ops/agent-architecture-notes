<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 600" width="934" height="600" role="img" aria-labelledby="t d"><title id="t">三层评审</title><desc id="d">第一层程序硬门检查时长、锁轨、响度和异常帧；第二层用校准过的模型只回答可核对的问题并双序提问；第三层由人观看完整有声成片做盲评。</desc><rect width="934" height="600" fill="#f8f6ed"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, WenQuanYi Zen Hei, sans-serif"><text x="34.0" y="53.0" font-size="32" fill="#202c29" font-weight="600" text-anchor="start">三层评审：先让程序把关，再让人判断好坏</text><text x="35.0" y="90.0" font-size="19" fill="#455b54" font-weight="400" text-anchor="start">越往下越贵、样本越少；只有最后一层回答“剪得更好没有”</text><rect x="34" y="124" width="760" height="130" rx="6" fill="#ffffff" stroke="#d1d8cd"/><rect x="34" y="124" width="7" height="130" rx="3" fill="#00806a"/><text x="58.0" y="158.0" font-size="20" fill="#202c29" font-weight="600" text-anchor="start">① 程序硬门</text><text x="174.4" y="158.0" font-size="15" fill="#455b54" font-weight="400" text-anchor="start">每个版本都过</text><text x="58.0" y="188.0" font-size="15" fill="#202c29" font-weight="400" text-anchor="start">时长与帧数 · 锁定轨道逐帧哈希 · 响度 −23 LUFS、真峰不高于 −1 dBTP · 黑帧、静音、冻帧</text><text x="58.0" y="240.0" font-size="15" fill="#00806a" font-weight="600" text-anchor="start">→ 不过即退回，并计入失败</text><rect x="89" y="274" width="650" height="130" rx="6" fill="#ffffff" stroke="#d1d8cd"/><rect x="89" y="274" width="7" height="130" rx="3" fill="#6d5bd0"/><text x="113.0" y="308.0" font-size="20" fill="#202c29" font-weight="600" text-anchor="start">② 模型预筛</text><text x="229.4" y="308.0" font-size="15" fill="#455b54" font-weight="400" text-anchor="start">只问能核对的问题</text><text x="113.0" y="338.0" font-size="15" fill="#202c29" font-weight="400" text-anchor="start">“这一段是不是指定人物？”“道具状态前后一致吗？” · 左右互换各问一次 · 先用带标签</text><text x="113.0" y="359.8" font-size="15" fill="#202c29" font-weight="400" text-anchor="start">片段校准</text><text x="113.0" y="390.0" font-size="15" fill="#6d5bd0" font-weight="600" text-anchor="start">→ 只淘汰明显不合格的版本</text><rect x="144" y="424" width="540" height="130" rx="6" fill="#ffffff" stroke="#d1d8cd"/><rect x="144" y="424" width="7" height="130" rx="3" fill="#c2410c"/><text x="168.0" y="458.0" font-size="20" fill="#202c29" font-weight="600" text-anchor="start">③ 人看成片</text><text x="284.4" y="458.0" font-size="15" fill="#455b54" font-weight="400" text-anchor="start">最后的裁决</text><text x="168.0" y="488.0" font-size="15" fill="#202c29" font-weight="400" text-anchor="start">完整、有声、全速播放 · 随机左右 · 允许平局和“都不可交付” · 按项</text><text x="168.0" y="509.8" font-size="15" fill="#202c29" font-weight="400" text-anchor="start">目统计差异</text><text x="168.0" y="540.0" font-size="15" fill="#c2410c" font-weight="600" text-anchor="start">→ 回答“观众更想要哪一版”</text><text x="910.0" y="594.0" font-size="14" fill="#6a7c75" font-weight="400" text-anchor="end">被前两层筛掉的版本也留在分母里</text></g></svg>
