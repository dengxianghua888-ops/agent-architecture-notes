<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 520" width="934" height="520" role="img" aria-labelledby="t d"><title id="t">盲选所需样本量</title><desc id="d">要检出55%、60%、65%、70%的真实胜率，分别约需783、194、85、47次独立的非平局判断。</desc><rect width="934" height="520" fill="#f8f6ed"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, WenQuanYi Zen Hei, sans-serif"><text x="34.0" y="53.0" font-size="32" fill="#202c29" font-weight="600" text-anchor="start">想证明“更好”，要看多少次盲选？</text><text x="35.0" y="90.0" font-size="19" fill="#455b54" font-weight="400" text-anchor="start">成对盲选中，检出真实胜率相对 50% 的差别所需的独立、非平局判断次数</text><path d="M250.0 118V376" stroke="#d1d8cd" stroke-width="1"/><text x="250.0" y="410.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">0</text><path d="M390.0 118V376" stroke="#d1d8cd" stroke-width="1"/><text x="390.0" y="410.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">200</text><path d="M530.0 118V376" stroke="#d1d8cd" stroke-width="1"/><text x="530.0" y="410.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">400</text><path d="M670.0 118V376" stroke="#d1d8cd" stroke-width="1"/><text x="670.0" y="410.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">600</text><path d="M810.0 118V376" stroke="#d1d8cd" stroke-width="1"/><text x="810.0" y="410.0" font-size="15" fill="#6a7c75" font-weight="400" text-anchor="middle">800</text><text x="234.0" y="155.0" font-size="17" fill="#202c29" font-weight="400" text-anchor="end">真实胜率 55%</text><path d="M250 128h544.1a4 4 0 0 1 4 4v32a4 4 0 0 1 -4 4h-544.1z" fill="#00806a"/><text x="808.1" y="155.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">783 次</text><text x="234.0" y="221.0" font-size="17" fill="#202c29" font-weight="400" text-anchor="end">真实胜率 60%</text><path d="M250 194h131.8a4 4 0 0 1 4 4v32a4 4 0 0 1 -4 4h-131.8z" fill="#00806a"/><text x="395.8" y="221.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">194 次</text><text x="234.0" y="287.0" font-size="17" fill="#202c29" font-weight="400" text-anchor="end">真实胜率 65%</text><path d="M250 260h55.5a4 4 0 0 1 4 4v32a4 4 0 0 1 -4 4h-55.5z" fill="#00806a"/><text x="319.5" y="287.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">85 次</text><text x="234.0" y="353.0" font-size="17" fill="#202c29" font-weight="400" text-anchor="end">真实胜率 70%</text><path d="M250 326h28.9a4 4 0 0 1 4 4v32a4 4 0 0 1 -4 4h-28.9z" fill="#00806a"/><text x="292.9" y="353.0" font-size="17" fill="#202c29" font-weight="600" text-anchor="start">47 次</text><text x="530.0" y="436.0" font-size="15" fill="#455b54" font-weight="400" text-anchor="middle">所需的独立非平局判断次数</text><text x="34.0" y="472.0" font-size="14" fill="#6a7c75" font-weight="400" text-anchor="start">双侧 α = 0.05，功效 80%。同一对成片由多人观看时，需乘以设计效应 1 + (m − 1) × ICC；</text><text x="34.0" y="496.0" font-size="14" fill="#6a7c75" font-weight="400" text-anchor="start">例如 5 人观看、ICC 为 0.3，194 次约变为 427 次。同一场戏换随机种子不算新样本。</text></g></svg>
